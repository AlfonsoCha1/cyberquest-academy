name: Despertar el API

# Render Free duerme el servicio tras 15 min sin tráfico. Este workflow lo despierta
# cada hora de 7:00 a 23:00 (hora de México, UTC-6); el API se mantiene despierto
# solo entre pings. Fuera de ese horario se deja dormir para ahorrar las 750 h gratis.
on:
  schedule:
    - cron: '5 13-23 * * *'   # 7:05 a 17:05 en México
    - cron: '5 0-5 * * *'     # 18:05 a 23:05 en México
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping a /health
        env:
          API_URL: ${{ vars.API_URL || 'https://cyberquest-api-1h1g.onrender.com' }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$API_URL/health" || echo "El API no respondió esta vez"
